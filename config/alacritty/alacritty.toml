[window]
opacity = 0.85
blur = true
padding = { x = 10, y = 10 }
dynamic_padding = true

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500

[colors.primary]
background = "#000000"
foreground = "#FFFFFF"

[colors.cursor]
text = "#000000"
cursor = "#FFFFFF"

[colors.selection]
text = "#000000"
background = "#FFFFFF"

[colors.normal]
black = "#121212"
red = "#888888"
green = "#999999"
yellow = "#AAAAAA"
blue = "#BBBBBB"
magenta = "#CCCCCC"
cyan = "#DDDDDD"
white = "#EEEEEE"

[colors.bright]
black = "#555555"
red = "#AAAAAA"
green = "#BBBBBB"
yellow = "#CCCCCC"
blue = "#DDDDDD"
magenta = "#EEEEEE"
cyan = "#FFFFFF"
white = "#FFFFFF"
