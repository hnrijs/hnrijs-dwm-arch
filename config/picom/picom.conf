#################################
#            Shadows            #
#################################

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#            Fading             #
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#    Transparency / Opacity     #
#################################

frame-opacity = 1.0;


#################################
#      Background-Blurring      #
#################################

blur-kern = "3x3box";



#################################
#       General Settings        #
#################################

# "xrender" is the safe default and works everywhere (incl. VMs / software
# rendering). On NVIDIA proprietary drivers it can cause mouse/render lag and
# broken vsync — if you see that, switch to "glx".
backend = "xrender";
dithered-present = false;
vsync = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#          Window Rules         #
#################################

rules: ({
  # No shadows on notifications and GTK frame windows
  match = "name = 'Notification'   || "
          "class_g ?= 'Notify-osd' || "
          "window_type = 'dock'    || "
          "window_type = 'dnd'     || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # No blur on dock, desktop, and GTK frame
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  # No rounded corners on dock and desktop
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # Menus, dialogs, tooltips: instant appear, no animation, no fade
  match = "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'tooltip'       || "
          "window_type = 'dialog'";
  fade = false;
  animations = false;
}, {
  # Tooltip shadow
  match = "window_type = 'tooltip'";
  shadow = true;
  full-shadow = false;
})
